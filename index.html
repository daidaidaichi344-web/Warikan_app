<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3E6B5C" />
    <title>わりかん帳</title>
    <script>
      window.addEventListener('error', function (e) {
        document.body.innerHTML =
          '<pre style="white-space:pre-wrap;padding:16px;color:#900;font-family:monospace;font-size:13px;">エラー: ' +
          (e.message || (e.error && e.error.message) || '不明なエラー') +
          '\n' + (e.filename || '') + ':' + (e.lineno || '') +
          '</pre>';
      });
      window.addEventListener('unhandledrejection', function (e) {
        document.body.innerHTML =
          '<pre style="white-space:pre-wrap;padding:16px;color:#900;font-family:monospace;font-size:13px;">エラー: ' +
          (e.reason && e.reason.message ? e.reason.message : String(e.reason)) +
          '</pre>';
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
